<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
<text x="40" y="50" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1f2937">Agent SDK 的六层：用户应用经接口层进入 agent loop</text>
<rect x="30" y="280" width="130" height="80" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="95" y="327" font-family="sans-serif" font-size="20" font-weight="bold" fill="#374151" text-anchor="middle">用户应用</text>
<line x1="160" y1="320" x2="194" y2="320" stroke="#6b7280" stroke-width="2"/>
<polygon points="200,320 190,314 190,326" fill="#6b7280"/>
<rect x="200" y="78" width="970" height="462" rx="14" fill="none" stroke="#9ca3af" stroke-width="2"/>
<text x="1155" y="104" font-family="sans-serif" font-size="18" fill="#6b7280" text-anchor="end">Agent SDK</text>
<rect x="215" y="160" width="110" height="320" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="270" y="300" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 接口层</text>
<text x="270" y="332" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">指定模型、</text>
<text x="270" y="354" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">工具、MCP；</text>
<text x="270" y="376" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">流式返回</text>
<rect x="340" y="120" width="120" height="360" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="400" y="290" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">② agent</text>
<text x="400" y="316" font-family="sans-serif" font-size="20" font-weight="bold" fill="#6d28d9" text-anchor="middle">loop</text>
<text x="400" y="350" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">反复调工具，</text>
<text x="400" y="372" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">直到完成或</text>
<text x="400" y="394" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">无法恢复</text>
<rect x="475" y="120" width="300" height="90" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
<text x="495" y="152" font-family="sans-serif" font-size="20" font-weight="bold" fill="#a16207">③ session</text>
<rect x="495" y="166" width="120" height="32" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
<text x="555" y="188" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">上下文</text>
<rect x="630" y="166" width="125" height="32" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
<text x="692" y="188" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">对话历史</text>
<rect x="475" y="225" width="300" height="255" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
<text x="495" y="257" font-family="sans-serif" font-size="20" font-weight="bold" fill="#15803d">④ 工具层</text>
<rect x="495" y="272" width="260" height="52" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
<text x="625" y="304" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">内建工具（读写文件、跑命令…）</text>
<rect x="495" y="336" width="260" height="52" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
<text x="625" y="368" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">工具注册与执行</text>
<rect x="495" y="400" width="260" height="62" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
<text x="625" y="436" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">外部工具（MCP、skills）</text>
<rect x="790" y="120" width="160" height="360" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
<text x="870" y="290" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0e7490" text-anchor="middle">⑥ LLM</text>
<text x="870" y="316" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0e7490" text-anchor="middle">抽象层</text>
<text x="870" y="350" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">对接不同</text>
<text x="870" y="372" font-family="sans-serif" font-size="15" fill="#374151" text-anchor="middle">模型的 SDK</text>
<rect x="965" y="120" width="190" height="64" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="1060" y="159" font-family="sans-serif" font-size="17" fill="#374151" text-anchor="middle">OpenAI</text>
<rect x="965" y="196" width="190" height="64" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="1060" y="235" font-family="sans-serif" font-size="17" fill="#374151" text-anchor="middle">Claude</text>
<rect x="965" y="272" width="190" height="64" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="1060" y="311" font-family="sans-serif" font-size="17" fill="#374151" text-anchor="middle">Qwen</text>
<text x="1060" y="372" font-family="sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">…</text>
<rect x="965" y="400" width="190" height="64" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="1060" y="439" font-family="sans-serif" font-size="17" fill="#374151" text-anchor="middle">Kimi</text>
<rect x="475" y="492" width="680" height="38" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
<text x="815" y="517" font-family="sans-serif" font-size="17" font-weight="bold" fill="#be123c" text-anchor="middle">⑤ 权限控制 / hooks / 日志</text>
<line x1="590" y1="530" x2="590" y2="578" stroke="#6b7280" stroke-width="2"/>
<polygon points="590,586 584,576 596,576" fill="#6b7280"/>
<line x1="660" y1="586" x2="660" y2="538" stroke="#6b7280" stroke-width="2"/>
<polygon points="660,530 654,540 666,540" fill="#6b7280"/>
<rect x="475" y="586" width="300" height="60" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
<text x="625" y="616" font-family="sans-serif" font-size="18" font-weight="bold" fill="#374151" text-anchor="middle">系统 sandbox</text>
<text x="625" y="638" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">工具真正动手的隔离环境</text>
<text x="40" y="640" font-family="sans-serif" font-size="14" fill="#6b7280">教学示意：按第 1 讲讲解的结构重画</text>
</svg>
