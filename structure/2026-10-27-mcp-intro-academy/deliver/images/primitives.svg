<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <g>
    <text font-family="sans-serif" x="600" y="56" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">三种原语：看谁决定什么时候用</text>
    <rect x="60" y="100" width="340" height="470" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <rect x="430" y="100" width="340" height="470" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <rect x="800" y="100" width="340" height="470" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <g>
      <text font-family="sans-serif" text-anchor="middle" x="230" y="160" font-size="30" font-weight="bold" fill="#7c2d12">工具</text>
      <text font-family="sans-serif" text-anchor="middle" x="600" y="160" font-size="30" font-weight="bold" fill="#14532d">资源</text>
      <text font-family="sans-serif" text-anchor="middle" x="970" y="160" font-size="30" font-weight="bold" fill="#1e1b4b">提示</text>
      <text font-family="sans-serif" text-anchor="middle" x="230" y="205" font-size="22" fill="#111827">模型控制</text>
      <text font-family="sans-serif" text-anchor="middle" x="600" y="205" font-size="22" fill="#111827">应用控制</text>
      <text font-family="sans-serif" text-anchor="middle" x="970" y="205" font-size="22" fill="#111827">用户控制</text>
    </g>
    <g fill="#374151">
      <text font-family="sans-serif" font-size="19" fill="#374151" x="90" y="260">Claude 自己决定何时调用</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="90" y="292">用来：给 Claude 新能力</text>
      <text font-family="sans-serif" font-size="19" fill="#111827" x="90" y="350" font-weight="bold">课程项目里</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="90" y="384">read_doc_contents</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="90" y="414">edit_document</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="90" y="470">触发：回答问题、执行</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="90" y="500">format 时由 Claude 调用</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="460" y="260">应用代码决定何时取、怎么用</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="460" y="292">用来：补全列表、注入上下文</text>
      <text font-family="sans-serif" font-size="19" fill="#111827" x="460" y="350" font-weight="bold">课程项目里</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="460" y="384">docs://documents</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="460" y="414">docs://documents/{doc_id}</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="460" y="470">触发：输入 @ 时补全，</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="460" y="500">选中后把内容放进问题</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="830" y="260">用户点按钮或打斜杠命令</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="830" y="292">用来：预设好的工作流</text>
      <text font-family="sans-serif" font-size="19" fill="#111827" x="830" y="350" font-weight="bold">课程项目里</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="830" y="384">format</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="830" y="414">summarize（自己写）</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="830" y="470">触发：/format 文档ID、</text>
      <text font-family="sans-serif" font-size="19" fill="#374151" x="830" y="500">/summarize 文档ID</text>
    </g>
    <text font-family="sans-serif" x="600" y="625" font-size="16" fill="#6b7280" text-anchor="middle">教学示意，2026-10-27 依据课程 L11 分类与课程项目实现绘制；是选型指引，不是协议硬性限制</text>
  </g>
</svg>
