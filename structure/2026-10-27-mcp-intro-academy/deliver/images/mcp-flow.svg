    <line x1="550" y1="290" x2="652" y2="290"/>
    <line x1="660" y1="360" x2="558" y2="360"/>
    <line x1="880" y1="325" x2="962" y2="325"/>
    <line x1="420" y1="400" x2="420" y2="462"/>
    <line x1="460" y1="470" x2="460" y2="408"/>
