<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="600" y="52" font-family="sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">一次工具调用的路线（stdio 本机连接）</text>
  <g>
