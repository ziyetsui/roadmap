<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
<text x="50" y="62" fill="#18333d" font-family="sans-serif" font-size="35" font-weight="bold" text-anchor="start">步骤 12 · 预算是一串乘法，不是一句「大概几天」</text>
<text x="50" y="105" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">微批 8 × 长度 1024 × 累积 8 × 卡数 8，每次更新 524,288 个 token。</text>
<rect x="40" y="200" width="190" height="110" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="135.0" y="247.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">B 微批</text>
<text x="135.0" y="279.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">8</text>
<text x="243" y="262" fill="#c66b24" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">×</text>
<rect x="268" y="200" width="190" height="110" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="363.0" y="247.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">T 长度</text>
<text x="363.0" y="279.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">1024</text>
<text x="471" y="262" fill="#c66b24" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">×</text>
<rect x="496" y="200" width="190" height="110" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="591.0" y="247.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">A 累积</text>
<text x="591.0" y="279.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">8</text>
<text x="699" y="262" fill="#c66b24" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">×</text>
<rect x="724" y="200" width="190" height="110" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="819.0" y="247.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">W 卡数</text>
<text x="819.0" y="279.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">8</text>
<text x="927" y="262" fill="#c66b24" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">×</text>
<rect x="952" y="200" width="190" height="110" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="1047.0" y="247.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">U 更新</text>
<text x="1047.0" y="279.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">10,000</text>
<text x="40" y="380" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">8 × 1024 = 8,192  →  ×8 = 65,536  →  ×8 = 524,288 token / 更新</text>
<text x="40" y="424" fill="#c66b24" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">524,288 × 10,000 = 5,242,880,000 token ≈ 5.24B</text>
<rect x="40" y="480" width="520" height="110" rx="10" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="300.0" y="527.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">更新一次 ≠ 看一份新数据</text>
<text x="300.0" y="559.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">累积与多卡都在放大 batch</text>
<rect x="600" y="480" width="560" height="110" rx="10" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="880.0" y="527.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">多卡都从同一偏移读同一批</text>
<text x="880.0" y="559.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">卡数增加，有效数据没增加</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：顺着乘号从左走到右，每一步都问「这一维是谁决定的」。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">易错：global batch 到底怎么算要看脚本；有的实现先除 world size，再乘累积。</text>
</svg>