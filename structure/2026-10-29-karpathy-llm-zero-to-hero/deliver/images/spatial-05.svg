<text x="90" y="155" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">输出接近 ±1 时曲线变平</text>
<text x="700" y="430" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">输入 x</text>
<text x="460" y="195" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">输出 tanh(x)</text>
<text x="460" y="245" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">+1</text>
<text x="460" y="545" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">−1</text>
<rect x="855" y="215" width="280" height="125" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="995.0" y="267.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">x = 0</text>
<text x="995.0" y="305.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">局部导数 = 1</text>
<rect x="855" y="410" width="280" height="125" rx="12" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="995.0" y="462.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">x = 3</text>
<text x="995.0" y="500.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">导数 ≈ 0.0099</text>
<text x="50" y="670" fill="#18333d" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="start">先检查初始化和中间信号，再比较修复前后的分布。</text>
<text x="50" y="713" fill="#516771" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">曲线是数学关系；饱和比例只是线索，不能单凭它判定训练失败。</text>
