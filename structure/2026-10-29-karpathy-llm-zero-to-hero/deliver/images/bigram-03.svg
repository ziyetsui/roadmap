<rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
<text x="50" y="62" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="start">步骤 3 · 交叉熵：给真实答案的概率越低，惩罚越高</text>
<text x="50" y="108" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">横轴是模型给真实下一个字符的概率 p，纵轴是这一次的损失 −log(p)。</text>
