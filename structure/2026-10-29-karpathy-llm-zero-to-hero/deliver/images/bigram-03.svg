<text x="970.0" y="229.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">整本数据上的平均：2.454</text>
<text x="970.0" y="263.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">比均匀猜的 3.30 低</text>
<text x="970.0" y="297.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">说明学到了一些接法</text>
<rect x="800" y="370" width="340" height="150" rx="10" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="970.0" y="419.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">p 越小，惩罚越高</text>
<text x="970.0" y="453.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">p → 0 时高度趋于无穷</text>
<text x="970.0" y="487.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">所以要先加一平滑</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">手指读图：先在横轴找到这次真实答案拿到的概率，再竖直向上碰到曲线，读纵轴高度，就是这次损失。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">易错：交叉熵不是“准确率”；它衡量模型给正确答案分配了多少概率，越低越好，但没有固定满分线。</text>
</svg>