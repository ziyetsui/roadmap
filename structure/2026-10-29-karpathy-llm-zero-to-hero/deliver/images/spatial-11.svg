<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="50" y="65" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="start">步骤 11 · 同一把秒表，同一份工作</text>
<text x="50" y="110" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="start">横条只表示工序，宽度不代表真实耗时；瓶颈必须实测。</text>
<rect x="55" y="190" width="1090" height="90" rx="12" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="600.0" y="244.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">准备区：预热 / 首次编译成本单列</text>
<rect x="65" y="390" width="235" height="110" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="182.5" y="454.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">清梯度</text>
<line x1="300" y1="445" x2="340" y2="445" stroke="#087f8c" stroke-width="4"/>
<polygon points="340.0,445.0 325.0,438.0 325.0,452.0" fill="#087f8c"/>
<rect x="340" y="390" width="235" height="110" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="457.5" y="454.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">前向与 loss</text>
<line x1="575" y1="445" x2="615" y2="445" stroke="#087f8c" stroke-width="4"/>
<polygon points="615.0,445.0 600.0,438.0 600.0,452.0" fill="#087f8c"/>
<rect x="615" y="390" width="235" height="110" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="732.5" y="454.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">反向传播</text>
<line x1="850" y1="445" x2="890" y2="445" stroke="#087f8c" stroke-width="4"/>
<polygon points="890.0,445.0 875.0,438.0 875.0,452.0" fill="#087f8c"/>
<rect x="890" y="390" width="235" height="110" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="1007.5" y="454.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">更新参数</text>
<text x="600" y="340" fill="#18333d" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">正式计时范围：一次完整参数更新</text>
<text x="600" y="565" fill="#c66b24" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">CUDA 两端同步，确认任务真的算完</text>
<text x="50" y="670" fill="#18333d" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="start">假设 20 次更新 × 2048 token ÷ 10 秒 = 4096 tokens/s。</text>
<text x="50" y="713" fill="#516771" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">假设数字只演示单位换算；不代表本机性能，也不是聊天生成速度。</text>
</svg>