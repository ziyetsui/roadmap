<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="50" y="65" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="start">步骤 13 · 把练习、选配置、最终检验分开</text>
<text x="50" y="110" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="start">每个结果都标明数据范围、模型检查点和评分规则。</text>
<rect x="55" y="210" width="330" height="240" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="220.0" y="301.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">训练房</text>
<text x="220.0" y="339.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">前向 / 反传</text>
<text x="220.0" y="377.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">允许更新参数</text>
<rect x="435" y="210" width="330" height="240" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="600.0" y="301.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">验证房</text>
<text x="600.0" y="339.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">只评分</text>
<text x="600.0" y="377.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">用于比较配置</text>
<rect x="815" y="210" width="330" height="240" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="980.0" y="301.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">最终测试房</text>
<text x="980.0" y="339.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">选择冻结后评估</text>
<text x="980.0" y="377.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">不据此反复调配置</text>
<rect x="310" y="525" width="580" height="85" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="600.0" y="576.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">检查点 + 数据版本 + 结果日志</text>
<line x1="220" y1="450" x2="450" y2="525" stroke="#087f8c" stroke-width="4"/>
<polygon points="450.0,525.0 437.9,513.7 433.6,527.0" fill="#087f8c"/>
<line x1="600" y1="450" x2="600" y2="525" stroke="#087f8c" stroke-width="4"/>
<polygon points="600.0,525.0 607.0,510.0 593.0,510.0" fill="#087f8c"/>
<line x1="980" y1="450" x2="750" y2="525" stroke="#087f8c" stroke-width="4"/>
<polygon points="750.0,525.0 766.4,527.0 762.1,513.7" fill="#087f8c"/>
<text x="50" y="670" fill="#18333d" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="start">eval 切换部分层的行为；no_grad 关闭求导记录；还要避免参数更新。</text>
<text x="50" y="713" fill="#516771" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">房间代表用途边界，不要求三台电脑；漂亮样本不能替代整体评估。</text>
</svg>