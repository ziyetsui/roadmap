<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
<text x="50" y="62" fill="#18333d" font-family="sans-serif" font-size="35" font-weight="bold" text-anchor="start">步骤 9 · BPE：反复把最常见的一对合成新符号</text>
<text x="50" y="105" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">极小语料 a b a b a c；只看相邻对，合并后序列变短。</text>
<rect x="60" y="170" width="100" height="80" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="110.0" y="218.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">a</text>
<rect x="180" y="170" width="100" height="80" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="230.0" y="218.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">b</text>
<rect x="300" y="170" width="100" height="80" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="350.0" y="218.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">a</text>
<rect x="420" y="170" width="100" height="80" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="470.0" y="218.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">b</text>
<rect x="540" y="170" width="100" height="80" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="590.0" y="218.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">a</text>
<rect x="660" y="170" width="100" height="80" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="710.0" y="218.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">c</text>
<text x="60" y="300" fill="#18333d" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">相邻对计数：ab 2 次、ba 2 次、ac 1 次；并列时按规则先选一个</text>
<line x1="380" y1="320" x2="380" y2="380" stroke="#087f8c" stroke-width="4"/>
<polygon points="380.0,380.0 387.0,365.0 373.0,365.0" fill="#087f8c"/>
<text x="410" y="350" fill="#c66b24" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">合并 ab → 新编号 256</text>
<rect x="90" y="390" width="130" height="80" rx="10" fill="#f7d9c2" stroke="#087f8c" stroke-width="2"/>
<text x="155.0" y="438.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">ab</text>
<rect x="240" y="390" width="130" height="80" rx="10" fill="#f7d9c2" stroke="#087f8c" stroke-width="2"/>
<text x="305.0" y="438.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">ab</text>
<rect x="390" y="390" width="130" height="80" rx="10" fill="#f7d9c2" stroke="#087f8c" stroke-width="2"/>
<text x="455.0" y="438.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">a</text>
<rect x="540" y="390" width="130" height="80" rx="10" fill="#f7d9c2" stroke="#087f8c" stroke-width="2"/>
<text x="605.0" y="438.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">c</text>
<text x="720" y="430" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">词表：256 → 257 → 258 …</text>
<text x="720" y="470" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">合并顺序不同，切出来的 token 也不同</text>
<rect x="60" y="530" width="520" height="110" rx="10" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="320.0" y="577.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">编码：按已学规则装包</text>
<text x="320.0" y="609.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">解码：拆回字节再按 UTF-8 还原</text>
<rect x="620" y="530" width="530" height="110" rx="10" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="885.0" y="577.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">往返检查：普通英文 / 中文 / emoji</text>
<text x="885.0" y="609.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">decode(encode(x)) 要等于原文</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：先看谁出现最多，再把它合成一个格子；重复到词表大小为止。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">易错：BPE 在 UTF-8 字节上合并，不是字符；在字节中间切断会得到坏文本。</text>
</svg>