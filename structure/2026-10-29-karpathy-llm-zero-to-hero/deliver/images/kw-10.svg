<text x="905.0" y="479.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">省下 38.6M，但要求两边维度相同</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：先看整条长度是 124M，再看四段各占多长；最长的一段是 12 个 Block。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">易错：词表 50,257 是原始 GPT-2；训练时常补到 50,304 只是为整除，不是换了分词器。</text>
