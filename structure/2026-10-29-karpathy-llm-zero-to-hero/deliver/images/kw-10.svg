<text x="50" y="62" fill="#18333d" font-family="sans-serif" font-size="35" font-weight="bold" text-anchor="start">步骤 10 · 124M 参数是从哪里长出来的</text>
<text x="50" y="105" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">GPT-2 124M：12 层、768 宽、1024 上下文、词表 50,257；合计 124,439,808。</text>
