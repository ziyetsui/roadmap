<rect x="401.80792564385825" y="220" width="738.1787435737606" height="90" rx="2" fill="#087f8c" stroke="#ffffff" stroke-width="2"/>
<rect x="1139.9866692176188" y="220" width="3" height="90" rx="2" fill="#e9edf1" stroke="#ffffff" stroke-width="2"/>
<text x="60" y="190" fill="#c66b24" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">token 嵌入 38.6M（31%）</text>
<text x="560" y="190" fill="#087f8c" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">12 个 Block：85.05M（68%）</text>
<text x="400" y="345" fill="#516771" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start">位置 0.79M</text>
<text x="1000" y="345" fill="#516771" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="end">末尾 LN 1,536</text>
<text x="60" y="400" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">50,257 × 768 = 38,597,376</text>
<text x="60" y="444" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">1,024 × 768 = 786,432</text>
<text x="60" y="488" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">每层 7,087,872 × 12 = 85,054,464</text>
