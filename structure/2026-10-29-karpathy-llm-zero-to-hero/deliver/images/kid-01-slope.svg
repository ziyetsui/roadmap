<text x="50" y="62" fill="#18333d" font-family="sans-serif" font-size="35" font-weight="bold" text-anchor="start">你量的不是「有多高」，是「有多陡」</text>
<text x="50" y="105" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">函数像一座滑梯：站的位置一样，陡度就一样；往前挪一小步，看高度变多少。</text>
