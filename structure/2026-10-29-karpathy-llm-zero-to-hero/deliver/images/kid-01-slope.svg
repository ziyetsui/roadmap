<circle cx="352.5" cy="384.3" r="8" fill="#c66b24"/>
<text x="336.5" y="364.2857142857143" fill="#c66b24" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="end">x = 2，高度 9</text>
<line x1="352.5" y1="384.2857142857143" x2="465.15625" y2="384.2857142857143" stroke="#6b7c86" stroke-width="2"/>
<line x1="465.15625" y1="384.2857142857143" x2="465.15625" y2="298.3107142857142" stroke="#6b7c86" stroke-width="2"/>
<text x="408.82812499999994" y="410.2857142857143" fill="#6b7c86" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="middle">往前走 h</text>
<text x="475.15625" y="303.42857142857144" fill="#6b7c86" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start">Δy</text>
<text x="95" y="580" fill="#18333d" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">你量了四次：h 越小，答案越靠近 8</text>
<text x="95" y="618" fill="#516771" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">横着走 h、竖着升 Δy，Δy ÷ h 就是坡度。</text>
<text x="640" y="175" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">h = 0.1</text>
<text x="850" y="175" fill="#18333d" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="end">8.3</text>
<text x="640" y="221" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">h = 0.01</text>
<text x="850" y="221" fill="#18333d" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="end">8.03</text>
<text x="640" y="267" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">h = 0.001</text>
<text x="850" y="267" fill="#18333d" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="end">8.003</text>
<text x="640" y="313" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">h = 0.0001</text>
<text x="850" y="313" fill="#18333d" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="end">8.0003</text>
<text x="640" y="359" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">真正的坡度</text>
<text x="850" y="359" fill="#c66b24" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="end">8</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：从 x=2 出发往右挪一点，看高度升了多少；横着走的路程做分母，竖着升的高度做分子。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">为什么正好是 8：f(x)=3x²−4x+5 的导数是 6x−4，代入 x=2 得 8。你用测量逼近了它。</text>
</svg>