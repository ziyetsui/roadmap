<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="50" y="65" fill="#18333d" font-family="sans-serif" font-size="38">正切 tan：这段坡有多陡？</text>
<text x="50" y="110" fill="#18333d" font-family="sans-serif" font-size="28">先看一个直角三角形：水平 4 米，升高 3 米。</text>
<polygon points="130,590 650,590 650,200" fill="#e7f5f3"/>
<line x1="130" y1="590" x2="650" y2="590" stroke="#087f8c" stroke-width="5"/>
<line x1="650" y1="590" x2="650" y2="200" stroke="#087f8c" stroke-width="5"/>
<line x1="130" y1="590" x2="650" y2="200" stroke="#c66b24" stroke-width="6"/>
<line x1="620" y1="590" x2="620" y2="560" stroke="#516771" stroke-width="2"/>
<line x1="620" y1="560" x2="650" y2="560" stroke="#516771" stroke-width="2"/>
<polyline points="230.0,590.0 229.9,584.6 229.4,579.3 228.7,574.0 227.7,568.7 226.4,563.5 224.9,558.4 223.0,553.3 220.9,548.4 218.6,543.6 216.0,538.9 213.1,534.4 210.0,530.0" fill="none" stroke="#c66b24" stroke-width="3"/>
<text x="245" y="555" fill="#c66b24" font-family="sans-serif" font-size="36">θ</text>
<text x="245" y="635" fill="#18333d" font-family="sans-serif" font-size="28">邻边：水平前进 4 米</text>
<text x="680" y="385" fill="#18333d" font-family="sans-serif" font-size="28">对边</text>
<text x="680" y="425" fill="#18333d" font-family="sans-serif" font-size="28">升高 3 米</text>
<text x="180" y="325" fill="#c66b24" font-family="sans-serif" font-size="28">斜边：沿坡走 5 米</text>
<rect x="850" y="210" width="305" height="270" rx="15" fill="#f1f5f8" stroke="#087f8c" stroke-width="2"/>
<text x="875" y="270" fill="#18333d" font-family="sans-serif" font-size="24">tan(θ) = 对边 / 邻边</text>
<text x="915" y="330" fill="#18333d" font-family="sans-serif" font-size="32">= 3 / 4</text>
<text x="915" y="385" fill="#18333d" font-family="sans-serif" font-size="36">= 0.75</text>
<text x="880" y="445" fill="#18333d" font-family="sans-serif" font-size="29">θ ≈ 36.87°</text>
<text x="50" y="705" fill="#18333d" font-family="sans-serif" font-size="29">每水平前进 1 米，升高 0.75 米。注意：不是沿坡走 1 米。</text>
</svg>