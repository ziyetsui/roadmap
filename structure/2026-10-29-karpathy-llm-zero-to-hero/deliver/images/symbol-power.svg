<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect x="0" y="0" width="1200" height="650" fill="#ffffff"/>
<text x="45" y="65" fill="#18333d" font-family="sans-serif" font-size="36">2³：从 1 出发，连续经过三道 ×2 门</text>
<rect x="45" y="160" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="105" y="220" fill="#18333d" font-family="sans-serif" font-size="34">1</text>
<line x1="195" y1="207" x2="315" y2="207" stroke="#087f8c" stroke-width="4"/>
<polygon points="315,207 300,200 300,214" fill="#087f8c"/>
<text x="225" y="180" fill="#18333d" font-family="sans-serif" font-size="28">×2</text>
<rect x="330" y="160" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="390" y="220" fill="#18333d" font-family="sans-serif" font-size="34">2</text>
<line x1="480" y1="207" x2="600" y2="207" stroke="#087f8c" stroke-width="4"/>
<polygon points="600,207 585,200 585,214" fill="#087f8c"/>
<text x="510" y="180" fill="#18333d" font-family="sans-serif" font-size="28">×2</text>
<rect x="615" y="160" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="675" y="220" fill="#18333d" font-family="sans-serif" font-size="34">4</text>
<line x1="765" y1="207" x2="885" y2="207" stroke="#087f8c" stroke-width="4"/>
<polygon points="885,207 870,200 870,214" fill="#087f8c"/>
<text x="795" y="180" fill="#18333d" font-family="sans-serif" font-size="28">×2</text>
<rect x="900" y="160" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="960" y="220" fill="#18333d" font-family="sans-serif" font-size="34">8</text>
<text x="45" y="340" fill="#18333d" font-family="sans-serif" font-size="36">3×2：三组 2 相加，总共是 6</text>
<rect x="65" y="425" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="125" y="485" fill="#18333d" font-family="sans-serif" font-size="34">2</text>
<rect x="350" y="425" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="410" y="485" fill="#18333d" font-family="sans-serif" font-size="34">2</text>
<rect x="635" y="425" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="695" y="485" fill="#18333d" font-family="sans-serif" font-size="34">2</text>
<rect x="965" y="425" width="150" height="95" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="1025" y="485" fill="#18333d" font-family="sans-serif" font-size="34">6</text>
<text x="265" y="485" fill="#18333d" font-family="sans-serif" font-size="38">+</text>
<text x="550" y="485" fill="#18333d" font-family="sans-serif" font-size="38">+</text>
<text x="860" y="485" fill="#18333d" font-family="sans-serif" font-size="38">=</text>
<text x="45" y="605" fill="#18333d" font-family="sans-serif" font-size="28">指数数“乘了几次”；这里的 3×2 则数“三组各两个”。</text>
</svg>