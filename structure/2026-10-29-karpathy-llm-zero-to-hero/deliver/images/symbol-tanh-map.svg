<text x="565" y="310" fill="#c66b24" font-family="sans-serif" font-size="25">(1, 0.762)</text>
<text x="100" y="710" fill="#18333d" font-family="sans-serif" font-size="26">读图：找到 x=1 → 向上碰到曲线 → 向左读 t≈0.762。</text>
<rect x="910" y="180" width="430" height="490" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="940" y="235" fill="#18333d" font-family="sans-serif" font-size="25">输入很大，输出也不会越过 1</text>
<text x="940" y="295" fill="#18333d" font-family="sans-serif" font-size="27">x = −3    →    t ≈ −0.995</text>
<text x="940" y="355" fill="#18333d" font-family="sans-serif" font-size="27">x = −1    →    t ≈ −0.762</text>
<text x="940" y="415" fill="#18333d" font-family="sans-serif" font-size="27">x = 0       →    t = 0</text>
<text x="940" y="475" fill="#18333d" font-family="sans-serif" font-size="27">x = 1       →    t ≈ 0.762</text>
<text x="940" y="535" fill="#18333d" font-family="sans-serif" font-size="27">x = 3       →    t ≈ 0.995</text>
<text x="940" y="620" fill="#18333d" font-family="sans-serif" font-size="24">负数在下半边，正数在上半边。</text>
<text x="45" y="780" fill="#18333d" font-family="sans-serif" font-size="27">同样把 x 增加 1：0 → 1 时，输出增加约 0.762；3 → 4 时，只增加约 0.0043。</text>
<text x="45" y="835" fill="#18333d" font-family="sans-serif" font-size="27">这就是“两端变平”：仍然在变化，只是越来越不敏感；不是硬切成 ±1。</text>
</svg>