<text x="787" y="323.5305" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="normal" text-anchor="middle">0.95</text>
<rect x="855" y="380" width="54" height="76.72099999999999" rx="2" fill="#7fb8b5" stroke="#ffffff" stroke-width="2"/>
