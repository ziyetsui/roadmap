<text x="100" y="560" fill="#516771" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start">第 0 次：错 1.32</text>
<text x="520" y="560" fill="#516771" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start">第 200 次：错 0.0069</text>
<text x="760" y="150" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">4 道题的答案（柱＝模型，横线＝正确）</text>
<rect x="760" y="299.5305" width="54" height="80.4695" rx="2" fill="#087f8c" stroke="#ffffff" stroke-width="2"/>
<line x1="754" y1="295" x2="820" y2="295" stroke="#c66b24" stroke-width="3"/>
