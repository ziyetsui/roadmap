<text x="977" y="448.7865" fill="#18333d" font-family="sans-serif" font-size="18" font-weight="normal" text-anchor="middle">-0.93</text>
<rect x="1045" y="303.398" width="54" height="76.602" rx="2" fill="#087f8c" stroke="#ffffff" stroke-width="2"/>
<line x1="1039" y1="295" x2="1105" y2="295" stroke="#c66b24" stroke-width="3"/>
<text x="1072" y="488" fill="#516771" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle">题4</text>
<text x="1072" y="327.398" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="normal" text-anchor="middle">0.90</text>
<line x1="750" y1="380" x2="1140" y2="380" stroke="#c9d6da" stroke-width="2"/>
<text x="760" y="530" fill="#c66b24" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start">橙色横线是正确答案：+1、−1、−1、+1</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：曲线越往右越低，说明错得越来越少；柱子和橙线越靠越近，说明答案越来越对。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">注意：它只学了这 4 道题，把新题做对是另一回事；这就是后面要分训练/验证的原因。</text>
</svg>