<text x="882" y="446.721" fill="#18333d" font-family="sans-serif" font-size="18" font-weight="normal" text-anchor="middle">-0.90</text>
<rect x="950" y="380" width="54" height="78.78649999999999" rx="2" fill="#7fb8b5" stroke="#ffffff" stroke-width="2"/>
