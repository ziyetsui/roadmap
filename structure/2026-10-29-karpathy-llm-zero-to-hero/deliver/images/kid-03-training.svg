<circle cx="370.0" cy="465.9" r="7" fill="#c66b24"/>
<text x="370.0" y="449.8642857142857" fill="#c66b24" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle">0.0193</text>
<line x1="370.0" y1="465.8642857142857" x2="510.0" y2="467.77142857142854" stroke="#087f8c" stroke-width="3"/>
<circle cx="510.0" cy="467.8" r="7" fill="#c66b24"/>
<text x="510.0" y="451.77142857142854" fill="#c66b24" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="middle">0.0104</text>
<line x1="510.0" y1="467.77142857142854" x2="650.0" y2="468.53214285714284" stroke="#087f8c" stroke-width="3"/>
<circle cx="650.0" cy="468.5" r="7" fill="#c66b24"/>
