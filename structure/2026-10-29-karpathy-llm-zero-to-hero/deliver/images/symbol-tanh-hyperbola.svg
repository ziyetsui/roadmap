<circle cx="399.18" cy="247.84" r="7" fill="#c66b24"/>
<text x="470" y="235" fill="#18333d" font-family="sans-serif" font-size="25">P ≈ (1.543, 1.175)</text>
<text x="180" y="510" fill="#18333d" font-family="sans-serif" font-size="25">U ≈ 1.543</text>
<text x="414.1774983963628" y="375" fill="#18333d" font-family="sans-serif" font-size="25">V ≈ 1.175</text>
<text x="70" y="650" fill="#18333d" font-family="sans-serif" font-size="27">U² − V² = 1</text>
<rect x="760" y="190" width="390" height="400" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="790" y="245" fill="#18333d" font-family="sans-serif" font-size="27">以参数 x = 1 为例</text>
<text x="790" y="310" fill="#18333d" font-family="sans-serif" font-size="25">U = cosh(1) ≈ 1.543</text>
<text x="790" y="365" fill="#18333d" font-family="sans-serif" font-size="25">V = sinh(1) ≈ 1.175</text>
<text x="790" y="430" fill="#18333d" font-family="sans-serif" font-size="28">tanh(1) = V / U</text>
<text x="790" y="480" fill="#18333d" font-family="sans-serif" font-size="32">≈ 0.762</text>
<text x="790" y="550" fill="#18333d" font-family="sans-serif" font-size="23">等于这条橙色射线的斜率。</text>
<text x="45" y="720" fill="#18333d" font-family="sans-serif" font-size="26">注意：参数 x 不是横坐标 U，也不是橙色射线与横轴的普通角度。</text>
<text x="45" y="765" fill="#18333d" font-family="sans-serif" font-size="25">因为 U² = 1 + V²，所以 |V| 总小于 U，比例 V/U 位于 −1 与 1 之间。</text>
<line x1="320" y1="195" x2="360" y2="230" stroke="#78949a" stroke-width="2"/>
</svg>