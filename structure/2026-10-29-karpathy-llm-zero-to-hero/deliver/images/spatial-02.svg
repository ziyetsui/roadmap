<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="50" y="65" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="start">步骤 2 · 数字沿图向前，梯度沿依赖返回</text>
<text x="50" y="110" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="start">例：d = a × b + c。框内同时显示数值与对最终 d 的导数。</text>
<rect x="60" y="180" width="230" height="110" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="175.0" y="225.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">a = 2</text>
<text x="175.0" y="263.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">grad = 3</text>
<rect x="60" y="410" width="230" height="110" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="175.0" y="455.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">b = 3</text>
<text x="175.0" y="493.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">grad = 2</text>
<rect x="460" y="285" width="250" height="115" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="585.0" y="332.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">u = a × b = 6</text>
<text x="585.0" y="370.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">grad = 1</text>
<rect x="460" y="470" width="250" height="110" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="585.0" y="515.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">c = 4</text>
<text x="585.0" y="553.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">grad = 1</text>
<rect x="895" y="285" width="245" height="115" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="1017.5" y="332.5" fill="#18333d" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="middle">d = u + c = 10</text>
<text x="1017.5" y="370.5" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">grad = 1</text>
<line x1="290" y1="235" x2="460" y2="315" stroke="#087f8c" stroke-width="4"/>
<polygon points="460.0,315.0 449.4,302.3 443.4,314.9" fill="#087f8c"/>
<line x1="290" y1="465" x2="460" y2="370" stroke="#087f8c" stroke-width="4"/>
<polygon points="460.0,370.0 443.5,371.2 450.3,383.4" fill="#087f8c"/>
<line x1="710" y1="340" x2="895" y2="340" stroke="#087f8c" stroke-width="4"/>
<polygon points="895.0,340.0 880.0,333.0 880.0,347.0" fill="#087f8c"/>
<line x1="710" y1="525" x2="895" y2="390" stroke="#087f8c" stroke-width="4"/>
<polygon points="895.0,390.0 878.8,393.2 887.0,404.5" fill="#087f8c"/>
<text x="345" y="200" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="normal" text-anchor="start">×</text>
<text x="795" y="290" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="normal" text-anchor="start">+</text>
<line x1="1090" y1="170" x2="870" y2="170" stroke="#c66b24" stroke-width="4"/>
<polygon points="870.0,170.0 885.0,177.0 885.0,163.0" fill="#c66b24"/>
<text x="1120" y="210" fill="#c66b24" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="end">反向读图</text>
<text x="50" y="670" fill="#18333d" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="start">先算出 d，再从 d.grad = 1 开始：加法传 1，乘法再乘另一输入。</text>
<text x="50" y="713" fill="#516771" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">橙色提示反向阅读；grad 与 data 是两个独立记录，不要相互替换。</text>
</svg>