<text x="820" y="430" fill="#516771" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start">缓慢上升：与 loss 不同步</text>
<rect x="40" y="490" width="1100" height="100" rx="10" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="590.0" y="548.0" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="middle">把三个数放在同一张结论句里：数据版本、tokenizer、训练量、评测实现，缺一项就不能排高低。</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：先看验证 loss 的拐点，再看基准分数有没有跟着动，最后才看生成样本像不像。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">易错：训练 loss 更低不等于更好；挑几段顺眼样本，也不能替代整体评测。</text>
</svg>