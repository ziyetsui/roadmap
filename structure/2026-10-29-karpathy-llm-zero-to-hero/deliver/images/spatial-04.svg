<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="50" y="65" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="start">步骤 4 · 字符先查名牌，再把名牌放在一起</text>
<text x="50" y="110" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="start">示例 D=2：三个字符对应三张两格名牌，拼成六个数。</text>
<rect x="50" y="180" width="120" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="110.0" y="234.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">e</text>
<rect x="270" y="180" width="260" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="400.0" y="234.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">[0.2, -0.1]</text>
<line x1="170" y1="225" x2="270" y2="225" stroke="#087f8c" stroke-width="4"/>
<polygon points="270.0,225.0 255.0,218.0 255.0,232.0" fill="#087f8c"/>
<line x1="530" y1="225" x2="640" y2="375" stroke="#087f8c" stroke-width="4"/>
<polygon points="640.0,375.0 636.8,358.8 625.5,367.0" fill="#087f8c"/>
<rect x="50" y="330" width="120" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="110.0" y="384.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">m</text>
<rect x="270" y="330" width="260" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="400.0" y="384.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">[0.7, 0.4]</text>
<line x1="170" y1="375" x2="270" y2="375" stroke="#087f8c" stroke-width="4"/>
<polygon points="270.0,375.0 255.0,368.0 255.0,382.0" fill="#087f8c"/>
<line x1="530" y1="375" x2="640" y2="375" stroke="#087f8c" stroke-width="4"/>
<polygon points="640.0,375.0 625.0,368.0 625.0,382.0" fill="#087f8c"/>
<rect x="50" y="480" width="120" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="110.0" y="534.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">m</text>
<rect x="270" y="480" width="260" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="400.0" y="534.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">[0.7, 0.4]</text>
<line x1="170" y1="525" x2="270" y2="525" stroke="#087f8c" stroke-width="4"/>
<polygon points="270.0,525.0 255.0,518.0 255.0,532.0" fill="#087f8c"/>
<line x1="530" y1="525" x2="640" y2="375" stroke="#087f8c" stroke-width="4"/>
<polygon points="640.0,375.0 625.5,383.0 636.8,391.2" fill="#087f8c"/>
<rect x="640" y="290" width="190" height="170" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="735.0" y="346.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">拼接</text>
<text x="735.0" y="384.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">3 × 2 = 6</text>
<text x="735.0" y="422.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">一条数字带</text>
<rect x="940" y="230" width="210" height="120" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="1045.0" y="280.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">隐藏层</text>
<text x="1045.0" y="318.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">H 个数</text>
<rect x="940" y="440" width="210" height="120" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="1045.0" y="490.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">输出打分</text>
<text x="1045.0" y="528.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">V 个 logits</text>
<line x1="830" y1="345" x2="940" y2="290" stroke="#087f8c" stroke-width="4"/>
<polygon points="940.0,290.0 923.5,290.4 929.7,303.0" fill="#087f8c"/>
<line x1="1045" y1="350" x2="1045" y2="440" stroke="#087f8c" stroke-width="4"/>
<polygon points="1045.0,440.0 1052.0,425.0 1038.0,425.0" fill="#087f8c"/>
<text x="50" y="670" fill="#18333d" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="start">两次 m 查到的是同一行参数；反传时两次贡献要累加回去。</text>
<text x="50" y="713" fill="#516771" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">名牌数字为教学假设；某一维不自动代表“元音”等人工概念。</text>
</svg>