<text x="890.0" y="418.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">只对 B 求，T 维不存在</text>
<text x="890.0" y="450.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">轴选错，形状对但结果不对</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：先在曲线上找到信号区间，再看 BN 把哪几个位置算作「一批」。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">易错：BN 的统计量来自批次，不是固定常数；评估时必须用累计的 running 统计量。</text>
