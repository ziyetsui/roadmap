<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
<rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
<text x="50" y="62" fill="#18333d" font-family="sans-serif" font-size="35" font-weight="bold" text-anchor="start">步骤 2 · 链式法则：把每一站的比例乘回去</text>
<text x="50" y="105" fill="#18333d" font-family="sans-serif" font-size="24" font-weight="normal" text-anchor="start">例：u = a×b，d = u+c，L = 2d；看 a 动一点，最终 L 会动多少。</text>
<rect x="55" y="175" width="150" height="90" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="130.0" y="212.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">a = 2</text>
<text x="130.0" y="244.0" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="middle">∂u/∂a = 3</text>
<rect x="55" y="365" width="150" height="90" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="130.0" y="402.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">b = 3</text>
<text x="130.0" y="434.0" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="middle">∂u/∂b = 2</text>
<rect x="330" y="262" width="200" height="100" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="430.0" y="304.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">u = a×b = 6</text>
<text x="430.0" y="336.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">∂u/∂a = 3</text>
<rect x="330" y="480" width="200" height="85" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="430.0" y="514.5" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">c = 4</text>
<text x="430.0" y="546.5" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">∂d/∂c = 1</text>
<rect x="650" y="330" width="180" height="100" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="740.0" y="372.0" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="middle">d = u+c = 10</text>
<text x="740.0" y="404.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">dd/du = 1</text>
<rect x="940" y="330" width="180" height="100" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="1030.0" y="372.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">L = 2d = 20</text>
<text x="1030.0" y="404.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">dL/dd = 2</text>
<line x1="205" y1="215" x2="330" y2="295" stroke="#087f8c" stroke-width="4"/>
<polygon points="330.0,295.0 321.1,281.0 313.6,292.8" fill="#087f8c"/>
<line x1="205" y1="400" x2="330" y2="330" stroke="#087f8c" stroke-width="4"/>
<polygon points="330.0,330.0 313.5,331.2 320.3,343.4" fill="#087f8c"/>
<line x1="530" y1="310" x2="650" y2="365" stroke="#087f8c" stroke-width="4"/>
<polygon points="650.0,365.0 639.3,352.4 633.4,365.1" fill="#087f8c"/>
<line x1="530" y1="520" x2="650" y2="400" stroke="#087f8c" stroke-width="4"/>
<polygon points="650.0,400.0 634.4,405.7 644.3,415.6" fill="#087f8c"/>
<line x1="830" y1="380" x2="940" y2="380" stroke="#087f8c" stroke-width="4"/>
<polygon points="940.0,380.0 925.0,373.0 925.0,387.0" fill="#087f8c"/>
<text x="60" y="610" fill="#c66b24" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="start">dL/da = dL/dd × dd/du × du/da = 2 × 1 × 3 = 6</text>
<text x="60" y="648" fill="#516771" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">数值核对：(L(a+0.001) − L(a)) / 0.001 ≈ 6.000</text>
<text x="50" y="700" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">手指读图：从 L 往回走，每经过一个盒子就乘上这一盒的局部导数，到 a 时得到 6。</text>
<text x="50" y="742" fill="#516771" font-family="sans-serif" font-size="22" font-weight="normal" text-anchor="start">易错：梯度是「当前这一点」的斜率，不是参数本身；同一个数被用两次，两条贡献要相加。</text>
</svg>