<text x="64.0" y="310.0" fill="#18333d" font-family="sans-serif" font-size="23" font-weight="normal" text-anchor="start">+ 一个 b（整体偏移）</text>
<text x="64.0" y="368.0" fill="#516771" font-family="sans-serif" font-size="19" font-weight="normal" text-anchor="start">41 个可调数字：</text>
<text x="64.0" y="404.0" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">4×(3+1)</text>
<text x="64.0" y="436.0" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">+ 4×(4+1)</text>
<text x="64.0" y="468.0" fill="#087f8c" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">+ 1×(4+1) = 41</text>
