<text x="44.0" y="684.0" fill="#516771" font-family="sans-serif" font-size="20" font-weight="normal" text-anchor="start">连线只表示谁把数送给谁；圆的位置是画法。</text>
<text x="44.0" y="744.0" fill="#18333d" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">一个小工位算一次；许多工位接起来，才能算复杂一点。</text>
