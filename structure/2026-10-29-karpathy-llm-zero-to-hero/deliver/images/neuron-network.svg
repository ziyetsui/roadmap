<text x="44.0" y="58.0" fill="#18333d" font-family="sans-serif" font-size="31" font-weight="bold" text-anchor="start">步骤 2 · 三个数，走三层，出一个预测</text>
<text x="44.0" y="98.0" fill="#516771" font-family="sans-serif" font-size="21" font-weight="normal" text-anchor="start">MLP(3,[4,4,1])：每个圆是一个工位，过 tanh 后把数交给下一层。</text>
<rect x="44.0" y="186.0" width="320.0" height="316.0" rx="12" fill="#f7fbfa" stroke="#cbd9d9" stroke-width="1.5"/>
