<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="50" y="65" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="start">步骤 3 · 接龙表：先找行，再按这一行抽签</text>
<text x="50" y="110" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="start">三类教学例子：当前是 m，下一字符的计数为 2、1、0。</text>
<text x="290" y="195" fill="#18333d" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">a</text>
<text x="470" y="195" fill="#18333d" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">m</text>
<text x="650" y="195" fill="#18333d" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="middle">.</text>
<text x="80" y="280" fill="#18333d" font-family="sans-serif" font-size="30" font-weight="normal" text-anchor="start">m 行</text>
<rect x="210" y="230" width="160" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="290.0" y="284.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">2</text>
<rect x="390" y="230" width="160" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="470.0" y="284.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">1</text>
<rect x="570" y="230" width="160" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="650.0" y="284.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">0</text>
<text x="90" y="380" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="start">各加 1</text>
<line x1="480" y1="330" x2="480" y2="410" stroke="#087f8c" stroke-width="4"/>
<polygon points="480.0,410.0 487.0,395.0 473.0,395.0" fill="#087f8c"/>
<rect x="210" y="435" width="160" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="290.0" y="489.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">3/6</text>
<rect x="390" y="435" width="160" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="470.0" y="489.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">2/6</text>
<rect x="570" y="435" width="160" height="90" rx="12" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="650.0" y="489.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">1/6</text>
<rect x="860" y="300" width="270" height="150" rx="12" fill="#e9edf1" stroke="#087f8c" stroke-width="2"/>
<text x="995.0" y="346.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">按份额抽一个</text>
<text x="995.0" y="384.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">例如抽到 a</text>
<text x="995.0" y="422.0" fill="#18333d" font-family="sans-serif" font-size="28" font-weight="normal" text-anchor="middle">下一轮去 a 行</text>
<line x1="750" y1="475" x2="860" y2="400" stroke="#087f8c" stroke-width="4"/>
<polygon points="860.0,400.0 843.7,402.7 851.5,414.2" fill="#087f8c"/>
<text x="50" y="670" fill="#18333d" font-family="sans-serif" font-size="27" font-weight="normal" text-anchor="start">这一行的概率和 = 1；课程实际表通常是 27 × 27。</text>
<text x="50" y="713" fill="#516771" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">这里只记前一个字符；格子的排列不是字符含义或好坏顺序。</text>
</svg>