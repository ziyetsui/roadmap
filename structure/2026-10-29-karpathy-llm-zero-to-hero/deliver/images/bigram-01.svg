<text x="590.0" y="274.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">. 516 · o 452 · …</text>
<rect x="820" y="150" width="340" height="130" rx="10" fill="#e7f5f3" stroke="#087f8c" stroke-width="2"/>
<text x="990.0" y="189.0" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="middle">③ 每格 +1，再除以 6,669</text>
<text x="990.0" y="223.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">a = 2591/6,669 ≈ 0.39</text>
