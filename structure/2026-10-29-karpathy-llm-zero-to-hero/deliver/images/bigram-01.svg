<text x="200.0" y="240.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">列＝下一个是谁</text>
<text x="200.0" y="274.0" fill="#18333d" font-family="sans-serif" font-size="26" font-weight="normal" text-anchor="middle">每张票落一格</text>
