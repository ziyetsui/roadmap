<text x="50" y="62" fill="#18333d" font-family="sans-serif" font-size="36" font-weight="bold" text-anchor="start">步骤 3 · 记票、分摊、抽签，是三件不同的事</text>
<text x="50" y="108" fill="#18333d" font-family="sans-serif" font-size="25" font-weight="normal" text-anchor="start">真实名字数据：32,033 个名字，27×27 表共 228,146 张票；下面始终跟着 m 这一行。</text>
