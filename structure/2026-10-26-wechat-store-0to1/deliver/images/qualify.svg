<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
<text x="50" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1f2937">申请「自媒体运营」类目前的 5 个判断</text>
<text x="50" y="92" font-family="sans-serif" font-size="18" fill="#6b7280">依据 2026-09-10 生效的教育培训准入标准与 2026-04-14 生效的类目管理规则</text>
<rect x="50" y="125" width="520" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="157" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">① 课程能写成“不点名平台、不讲 AI 赚钱”吗？</text>
<text x="68" y="186" font-family="sans-serif" font-size="16" fill="#1f2937">不能 → 这个类目不适合，先改课程方向</text>
<rect x="50" y="220" width="520" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="252" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">② 有营业执照，经营范围含教育咨询/培训？</text>
<text x="68" y="281" font-family="sans-serif" font-size="16" fill="#1f2937">没有 → 步骤 2 办个体户或增加经营范围</text>
<rect x="50" y="315" width="520" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="347" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">③ 有 ICP 备案或增值电信许可证？</text>
<text x="68" y="376" font-family="sans-serif" font-size="16" fill="#1f2937">没有 → 步骤 3 发起备案，等待期做内容线</text>
<rect x="50" y="410" width="520" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="442" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">④ 有 7 类讲师证书之一（本人或签约老师）？</text>
<text x="68" y="471" font-family="sans-serif" font-size="16" fill="#1f2937">没有 → 这是最长的卡点，见步骤 1 的三个选择</text>
<rect x="50" y="505" width="520" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="68" y="537" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1d4ed8">⑤ 类目保证金放得下吗？</text>
<text x="68" y="566" font-family="sans-serif" font-size="16" fill="#1f2937">2024 年截图为 1 万元，现行金额在后台核</text>
<line x1="580" y1="355" x2="660" y2="355" stroke="#6b7280" stroke-width="3"/>
<polygon points="660,345 680,355 660,365" fill="#6b7280"/>
<rect x="690" y="150" width="460" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="710" y="185" font-family="sans-serif" font-size="20" font-weight="bold" fill="#047857">5 项都是“有”</text>
<text x="710" y="218" font-family="sans-serif" font-size="17" fill="#1f2937">直接走步骤 8 开店、步骤 9 申请类目</text>
<text x="710" y="246" font-family="sans-serif" font-size="17" fill="#1f2937">内容线同时开始</text>
<rect x="690" y="300" width="460" height="130" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="710" y="335" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b45309">②③⑤ 缺，但 ①④ 有</text>
<text x="710" y="368" font-family="sans-serif" font-size="17" fill="#1f2937">按路线图办执照、备案，攒保证金</text>
<text x="710" y="396" font-family="sans-serif" font-size="17" fill="#1f2937">内容线照常，第 3 周再申请类目</text>
<rect x="690" y="450" width="460" height="135" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="710" y="485" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b91c1c">① 或 ④ 缺</text>
<text x="710" y="518" font-family="sans-serif" font-size="17" fill="#1f2937">先不交任何保证金、不付代办费</text>
<text x="710" y="546" font-family="sans-serif" font-size="17" fill="#1f2937">改课程方向，或先解决证书再开店</text>
<text x="50" y="640" font-family="sans-serif" font-size="15" fill="#6b7280">教学示意｜依据 O1、O2；制作于 2026-10-26；只整理判断顺序，不代表平台审核界面</text>
</svg>
