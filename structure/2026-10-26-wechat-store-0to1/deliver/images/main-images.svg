<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect x="0" y="0" width="1200" height="675" fill="#ffffff"/>
<text x="50" y="58" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1f2937">3 张主图各管一件事（虚构样例）</text>
<text x="50" y="92" font-family="sans-serif" font-size="18" fill="#6b7280">规则：至少 3 张、互不重复、和标题对应；图里可写品牌、讲师、大纲、交付方式、有效期、权益</text>
<rect x="60" y="125" width="340" height="440" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="84" y="165" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1d4ed8">主图 1｜这是什么课</text>
<text x="84" y="215" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1f2937">〔品牌〕</text>
<text x="84" y="255" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1f2937">短视频爆款</text>
<text x="84" y="290" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1f2937">拆解与原创写作课</text>
<text x="84" y="345" font-family="sans-serif" font-size="17" fill="#1f2937">适合：刚开始做内容的人</text>
<text x="84" y="375" font-family="sans-serif" font-size="17" fill="#1f2937">形式：线上视频课 〔X〕节</text>
<text x="84" y="405" font-family="sans-serif" font-size="17" fill="#1f2937">讲师：〔姓名〕</text>
<text x="84" y="530" font-family="sans-serif" font-size="15" fill="#6b7280">不写平台名、不写收益</text>
<rect x="430" y="125" width="340" height="440" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="454" y="165" font-family="sans-serif" font-size="20" font-weight="bold" fill="#047857">主图 2｜学什么</text>
<text x="454" y="215" font-family="sans-serif" font-size="17" fill="#1f2937">第 1 章 爆款为什么会传播</text>
<text x="454" y="250" font-family="sans-serif" font-size="17" fill="#1f2937">第 2 章 六维拆解表</text>
<text x="454" y="285" font-family="sans-serif" font-size="17" fill="#1f2937">第 3 章 选题库</text>
<text x="454" y="320" font-family="sans-serif" font-size="17" fill="#1f2937">第 4 章 借结构写原创脚本</text>
<text x="454" y="355" font-family="sans-serif" font-size="17" fill="#1f2937">第 5 章 拍摄剪辑基础</text>
<text x="454" y="390" font-family="sans-serif" font-size="17" fill="#1f2937">第 6 章 标题与封面</text>
<text x="454" y="425" font-family="sans-serif" font-size="17" fill="#1f2937">第 7 章 数据复盘</text>
<text x="454" y="530" font-family="sans-serif" font-size="15" fill="#6b7280">和详情页大纲一字不差</text>
<rect x="800" y="125" width="340" height="440" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="824" y="165" font-family="sans-serif" font-size="20" font-weight="bold" fill="#b45309">主图 3｜买了得到什么</text>
<text x="824" y="215" font-family="sans-serif" font-size="17" fill="#1f2937">· 〔X〕节录播课</text>
<text x="824" y="250" font-family="sans-serif" font-size="17" fill="#1f2937">· 拆解表、脚本模板、复盘表</text>
<text x="824" y="285" font-family="sans-serif" font-size="17" fill="#1f2937">· 有效期 3 年</text>
<text x="824" y="320" font-family="sans-serif" font-size="17" fill="#1f2937">· 下单后联系客服开通</text>
<text x="824" y="355" font-family="sans-serif" font-size="17" fill="#1f2937">· 退款规则见详情页</text>
<text x="824" y="530" font-family="sans-serif" font-size="15" fill="#6b7280">不写“包会”“保证涨粉”</text>
<text x="50" y="640" font-family="sans-serif" font-size="15" fill="#6b7280">教学示意｜虚构样例，〔〕内待填；依据 O1 主图要求；制作于 2026-10-26；不是平台界面</text>
</svg>
